spring:
  application:
    name: backend-main-gfsuhbulmw
    version: v1
    desc: backend-main-gfsuhbulmw RESTful API Service
  profiles:
    active: default
  mvc:
    throw-exception-if-no-handler-found: true
  jackson:
    date-format: yyyy-MM-dd'T'HH:mm:ss
  datasource:
    dbcp2:
      initial-size: 20
    url: jdbc:postgresql://${POSTGRES_HOST:127.0.0.1}:${POSTGRES_DB_PORT:5432}/${POSTGRES_DB_NAME:postgres}?allowMultiQueries=true
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USERNAME:postgres}
    password: ${POSTGRES_PASSWORD:0000}
    hikari:
      maximum-pool-size: 30
      maxLifeTime: 3300000
      connection-timeout: 30000
      idle-timeout: 600000
      connection-test-query: SELECT 1
      dialect: org.hibernate.dialect.PostgreSQLDialect
  sql:
    init:
      mode: always
      schema-locations: #classpath:schema-postgresql.sql
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    timeout-millis: 10000
    cluster-mode: false
  elasticsearch:
    host: ${ELASTICSEARCH_HOST:127.0.0.1}
    port: ${ELASTICSEARCH_PORT:30003}
    username: ${ELASTICSEARCH_USERNAME:elastic}
    password: ${ELASTICSEARCH_PASSWORD:0000}
server:
  port: 8080
  forward-headers-strategy: framework
service-path: ${SERVICE_PATH:}
springdoc:
  cache:
    disabled: true
  version: 1
  api-docs:
    path: /v3/api-docs
    enabled: true
    resolve-schema-properties: true
  default-consumes-media-type: application/json
  default-produces-media-type: application/json
  swagger-ui:
    operations-sorter: alpha
    tags-sorter: alpha
    path: /swagger-ui.html
    url: ${SERVICE_PATH:}/v3/api-docs
    config-url: ${SERVICE_PATH:}/v3/api-docs/swagger-config
    disable-swagger-default-url: true
    display-query-params-without-oauth2: true
    show-common-extensions: true
  show-actuator: true
  show-login-endpoint: true
logging:
  config: classpath:log4j2-spring.yml
  level:
    org.springframework.web.servlet.PageNotFound: 'OFF'
management:
  endpoints:
    web:
      exposure:
        include: '*'
mybatis:
  type-aliases-package: com.wannabe.app.main.request
  mapper-locations: mappers/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    use-generated-keys: true
jwt:
  secret: ${JWT_SECURITY_KEY:}
  #  access-token-expires-in-sec: 60 # 60 seconds
  access-token-expires-in-sec: 604800 # 7 days
  refresh-token-expires-in-sec: 7776000 # 90 days
cloud:
  aws:
    credentials:
      access-key: ${AWS_ACCESS_KEY:}
      secret-key: ${AWS_SECRET_KEY:}
    region:
      static: ${AWS_REGION:}
    s3:
      bucket: ${AWS_BUCKET_NAME:}
      target: "local"
      signedurl:
        expires: 1440
    cloud-front:
      distribution-domain: ${AWS_CLOUD_FRONT_DOMAIN:}
      key-pair-id: ${AWS_CLOUD_FRONT_KEYPAIR_ID:}
      private-key: ${AWS_CLOUD_FRONT_PRIVATE_KEY:}
      expired-milli-second: 86400000 # 1 day
social:
  kakao:
    admin-key: ${KAKAO_ADMIN_KEY:}
    client-id: ${KAKAO_CLIENT_ID:}
    client-secret: ${KAKAO_CLIENT_SECRET:}
    redirect-uri: ${KAKAO_REDIRECT_URI:}
  line:
    channel-id: ${LINE_CHANNEL_ID:}
    channel-secret: ${LINE_CHANNEL_SECRET:}
    redirect-uri: ${LINE_REDIRECT_URI:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
    redirect-uri: ${GOOGLE_REDIRECT_URI:}
  apple:
    client-id: 88P682HUA5.com.beautyluvwannabe.wannabe
    team_id: ${APPLE_TEAM_ID:}
    redirect-uri: ${APPLE_REDIRECT_URI:https://app.yeppeojida.com/api/main/auth/social/login}
domain:
  backend: ${BACKEND_DOMAIN:}
  article-path: ${ARTICLE_PATH:}
  review-path: ${REVIEW_PATH:}
  event-counsel-path: ${EVENT_COUNSEL_PATH:}
  hospital-counsel-path: ${HOSPITAL_COUNSEL_PATH:}
